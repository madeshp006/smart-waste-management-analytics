version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: waste_dw_postgres
    restart: always
    environment:
      POSTGRES_DB: waste_dw_db
      POSTGRES_USER: waste_user
      POSTGRES_PASSWORD: waste_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init_schemas.sql:/docker-entrypoint-initdb.d/01_init_schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste_user -d waste_dw_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waste_dw_backend
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_DB=waste_dw_db
      - POSTGRES_USER=waste_user
      - POSTGRES_PASSWORD=waste_password
      - SECRET_KEY=production-super-secret-key-waste-2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waste_dw_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
